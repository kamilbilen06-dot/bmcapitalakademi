<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Takas ve aracı kurum dağılımı analizi">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212e"/><stop offset="1" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg2)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/><line x1="0" y1="150" x2="400" y2="150"/>
  </g>
  <!-- circular exchange -->
  <g transform="translate(200,112)">
    <circle r="66" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10"/>
    <path d="M0,-66 A66,66 0 0,1 57,33" fill="none" stroke="#2ecc71" stroke-width="10" stroke-linecap="round"/>
    <path d="M-57,33 A66,66 0 0,1 0,-66" fill="none" stroke="#e74c3c" stroke-width="10" stroke-linecap="round" transform="scale(-1,1)"/>
    <path d="M-57,33 A66,66 0 0,0 57,33" fill="none" stroke="#f39c12" stroke-width="10" stroke-linecap="round"/>
    <polygon points="57,26 68,40 46,42" fill="#2ecc71"/>
    <polygon points="-57,40 -46,26 -68,24" fill="#e74c3c"/>
    <g fill="#ffffff">
      <rect x="-16" y="-14" width="32" height="6" rx="3"/>
      <rect x="-16" y="-2" width="24" height="6" rx="3" opacity="0.7"/>
      <rect x="-16" y="10" width="28" height="6" rx="3" opacity="0.5"/>
    </g>
  </g>
</svg>
