<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Teknik ve temel analiz grafiği">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212e"/><stop offset="1" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f39c12" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f39c12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ecc71"/><stop offset="1" stop-color="#27ae60"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/><line x1="0" y1="110" x2="400" y2="110"/><line x1="0" y1="160" x2="400" y2="160"/>
  </g>
  <!-- candlesticks -->
  <g stroke-width="2">
    <g stroke="#27ae60"><line x1="60" y1="120" x2="60" y2="175"/></g>
    <rect x="53" y="132" width="14" height="34" rx="2" fill="url(#up)"/>
    <g stroke="#e74c3c"><line x1="100" y1="110" x2="100" y2="168"/></g>
    <rect x="93" y="120" width="14" height="30" rx="2" fill="#e74c3c"/>
    <g stroke="#27ae60"><line x1="140" y1="95" x2="140" y2="150"/></g>
    <rect x="133" y="105" width="14" height="34" rx="2" fill="url(#up)"/>
  </g>
  <!-- trend area + line -->
  <path d="M30,165 L90,140 L140,150 L200,95 L260,115 L320,60 L370,80 L370,205 L30,205 Z" fill="url(#area)"/>
  <polyline points="30,165 90,140 140,150 200,95 260,115 320,60 370,80"
            fill="none" stroke="#f39c12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff"><circle cx="200" cy="95" r="4.5"/><circle cx="320" cy="60" r="4.5"/></g>
</svg>
